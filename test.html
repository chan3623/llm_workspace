<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심심해서 만드는 사이트</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        html {
            width: 100vw;
            height: 100vh;
        }

        body {
            width: 100%;
            height: 100%;
        }

        .main_bax {
            width: 100%;
            height: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .sec_box_1 {
            width: 100%;
            height: calc(100% / 5);
            background-color: #FFFFE0;
        }

        .sec_bax_1>h2 {
            font-size: 20px;
            color: #9AFB9A;
        }

        .sec_box_2 {}
    </style>
</head>

<body>
    <main class="main_box">
        <section class="sec_box_1">
            <h2>오늘의 랜덤 명언</h2>
        </section>
        <section class="sec_box_2">
            <div>
                <p>인생에 뜻을 세우는데 있어</p>
                <p>늦은 때라곤 없다</p>
                <p>_볼드윈</p>
            </div>
            <div>
                <button>생성하기</button>
            </div>
        </section>
        <section class="sec_box_3">
            <p>제작자 : Chan</p>
        </section>
    </main>
</body>

</html>
